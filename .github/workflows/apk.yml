name: Compiler l'APK

on:
  push:
    branches: [main]
    paths: ['app/**', 'moteur/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Préparer le projet Android
        run: |
          set -o pipefail
          flutter --version 2>&1 | tee ../journal-1-preparation.txt
          flutter create --org fr.cyril --project-name velo_coach --platforms android . 2>&1 | tee -a ../journal-1-preparation.txt
          rm -f test/widget_test.dart
          python3 ci/preparer_android.py 2>&1 | tee -a ../journal-1-preparation.txt
          # La clé de signature fixe (ci/debug.keystore) est branchée par
          # preparer_android.py : chaque version s'installe par-dessus.

      - name: Dépendances
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../journal-2-dependances.txt

      - name: Analyse et tests
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../journal-3-analyse.txt
          flutter test 2>&1 | tee -a ../journal-3-analyse.txt

      - name: Compilation
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee ../journal-4-compilation.txt
          cp build/app/outputs/flutter-apk/app-release.apk ../velo-coach.apk
          # Vérifie que l'APK est bien signé avec la clé fixe du dépôt
          attendu=$(keytool -list -v -keystore ci/debug.keystore -storepass android | grep -m1 'SHA256:' | sed 's/.*SHA256: //')
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          obtenu=$("$apksigner" verify --print-certs ../velo-coach.apk | grep -m1 'SHA-256 digest' | sed 's/.*: //' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "Clé attendue : $attendu" | tee -a ../journal-4-compilation.txt
          echo "Clé de l'APK : $obtenu" | tee -a ../journal-4-compilation.txt
          [ "$attendu" = "$obtenu" ] || { echo "APK signé avec une autre clé !" | tee -a ../journal-4-compilation.txt; exit 1; }

      # En cas d'échec, la fin des journaux devient une « annotation »,
      # lisible sans connexion (permet de corriger à distance).
      - name: Rendre les erreurs visibles
        if: failure()
        working-directory: .
        run: |
          for f in journal-*.txt; do
            [ -f "$f" ] || continue
            msg=$(tail -c 5000 "$f" | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Vélo Coach, version ${{ github.run_number }}
          body: "Télécharger velo-coach.apk ci-dessous et l'ouvrir sur le téléphone. S'installe à côté de Suivi direct (autre identifiant)."
          files: velo-coach.apk
          make_latest: true
